{% extends 'base.html' %}{% block title %}List an item{% endblock %}{% block content %}<div class="page-heading"><span class="eyebrow">SELL WITH BIDBAY</span><h1>Give your item a new story.</h1><p class="muted">Create a clear listing and let the bidding begin.</p></div><form class="form-card wide-form" method="post"><div class="form-grid"><label>Item title<input name="title" maxlength="100" required placeholder="e.g. Vintage film camera"></label><label>Category<select name="category"><option>Electronics</option><option>Home</option><option>Art</option><option>Fashion</option><option>Collectibles</option><option>Other</option></select></label><label class="full">Description<textarea name="description" rows="5" maxlength="1500" required placeholder="Describe the item's condition, features and details..."></textarea></label><label>Starting price (₹)<input type="number" name="starting_price" min="1" step="0.01" required placeholder="1000.00"></label><label>Auction duration<select name="hours"><option value="24">24 hours</option><option value="48">48 hours</option><option value="72">3 days</option><option value="168">7 days</option></select></label></div><div class="form-actions"><a class="text-link" href="{{ url_for('index') }}">Cancel</a><button class="btn" type="submit">Publish auction ↗</button></div></form>{% endblock %}
